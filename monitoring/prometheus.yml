# Prometheus Configuration for Transaction → Enrichment → Dispatcher Pipeline + MLOps
# Place this file in: ./monitoring/prometheus.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Rule files for alerts (optional)
rule_files:
  - "/etc/prometheus/alerts.yml"
  - "/etc/prometheus/ml_alerts.ym"  # ML-specific alerts

scrape_configs:
  # ========================================================================
  # TRANSACTION PIPELINE COMPONENTS
  # ========================================================================
  
  # Publisher component (port 8001)
  # Monitors: CSV injection, NATS publishing, TPS tracking
  - job_name: 'transaction-publisher'
    static_configs:
      - targets: ['host.docker.internal:8001']
        labels:
          component: 'publisher'
          stage: 'injection'
          environment: 'production'
    metrics_path: '/metrics'
    scrape_interval: 10s
    # More frequent scraping for real-time TPS monitoring

  # Enrichment component (port 8002)
  # Monitors: Customer 360 joins, feature engineering, match rates
  - job_name: 'transaction-enrichment'
    static_configs:
      - targets: ['host.docker.internal:8002']
        labels:
          component: 'enrichment'
          stage: 'customer360'
          environment: 'production'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Dispatcher component (port 8003)
  # Monitors: Lead generation, rejection reasons, cooldown filters
  - job_name: 'transaction-dispatcher'
    static_configs:
      - targets: ['host.docker.internal:8003']
        labels:
          component: 'dispatcher'
          stage: 'lead_generation'
          environment: 'production'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # ========================================================================
  # MLOPS COMPONENTS (CAR LOAN PREDICTOR)
  # ========================================================================
  
  # ML Predictor component (port 8005)
  # Monitors: Inference latency, confidence scores, cluster distribution, model drift
  - job_name: 'ml-car-predictor'
    static_configs:
      - targets: ['host.docker.internal:8005']
        labels:
          component: 'ml_predictor'
          model: 'car_loan_gmm'
          stage: 'inference'
          environment: 'production'
    metrics_path: '/metrics'
    scrape_interval: 5s
    # More frequent scraping for real-time drift detection

  # ML Feedback Loop component (port 8006)
  # Monitors: Online learning, model complexity, feedback processing
  - job_name: 'ml-car-feedback'
    static_configs:
      - targets: ['host.docker.internal:8006']
        labels:
          component: 'ml_feedback'
          model: 'car_loan_gmm'
          stage: 'online_learning'
          environment: 'production'
    metrics_path: '/metrics'
    scrape_interval: 5s
    # Frequent scraping to catch model updates quickly

  # ========================================================================
  # INFRASTRUCTURE MONITORING
  # ========================================================================
  
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          component: 'prometheus'
          infrastructure: 'monitoring'

  # NATS JetStream monitoring
  # Monitors: Stream health, message lag, consumer status
  - job_name: 'nats-jetstream'
    static_configs:
      - targets: ['nats:8222']
        labels:
          component: 'nats'
          messaging: 'jetstream'
          stream: 'transactions'
    metrics_path: '/varz'
    scrape_interval: 15s

  # System metrics via Node Exporter
  # Monitors: CPU, memory, disk I/O for pipeline nodes
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          component: 'system'
          node: 'pipeline-host'
    scrape_interval: 30s

  # ========================================================================
  # OPTIONAL: DATABASE MONITORING
  # ========================================================================
  
  # If using PostgreSQL for customer master data
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  #       labels:
  #         component: 'postgres'
  #         database: 'customer_master'

  # If using Redis for caching/state
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
  #       labels:
  #         component: 'redis'
  #         cache: 'customer_profiles'

  # ========================================================================
  # SERVICE DISCOVERY (Optional - for dynamic environments)
  # ========================================================================
  
  # Uncomment if running in Docker Swarm
  # - job_name: 'docker-swarm'
  #   dockerswarm_sd_configs:
  #     - host: unix:///var/run/docker.sock
  #       role: tasks
  #   relabel_configs:
  #     - source_labels: [__meta_dockerswarm_service_label_monitoring]
  #       action: keep
  #       regex: true

  # Uncomment if running in Kubernetes
