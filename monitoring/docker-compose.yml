# Docker Compose for Prometheus Monitoring
# Usage: docker-compose -f monitoring/docker-compose.yml up -d

version: '3.8'

services:
  # ========================================================================
  # Prometheus - Metrics Collection & Storage
  # ========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: transaction-pipeline-prometheus
    ports:
      - "9090:9090"
    volumes:
      # Mount Prometheus config
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Mount alert rules (if using)
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      # Persist data
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'  # Keep data for 30 days
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'  # Enable API to reload config
    networks:
      - monitoring
    restart: unless-stopped
    extra_hosts:
      # Allow Prometheus to reach your host machine
      - "host.docker.internal:host-gateway"

  # ========================================================================
  # Node Exporter - System Metrics (Optional)
  # ========================================================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: transaction-pipeline-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring
    restart: unless-stopped

  # ========================================================================
  # Alertmanager - Alert Routing (Optional)
  # ========================================================================
  # Uncomment this section if you want to set up alerting
  # alertmanager:
  #   image: prom/alertmanager:latest
  #   container_name: transaction-pipeline-alertmanager
  #   ports:
  #     - "9093:9093"
  #   volumes:
  #     - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
  #     - alertmanager-data:/alertmanager
  #   command:
  #     - '--config.file=/etc/alertmanager/alertmanager.yml'
  #     - '--storage.path=/alertmanager'
  #   networks:
  #     - monitoring
  #   restart: unless-stopped

  # ========================================================================
  # Grafana - Visualization (Optional - for Part 2)
  # ========================================================================
  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: transaction-pipeline-grafana
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - GF_SECURITY_ADMIN_USER=admin
  #     - GF_SECURITY_ADMIN_PASSWORD=admin
  #     - GF_USERS_ALLOW_SIGN_UP=false
  #   volumes:
  #     - grafana-data:/var/lib/grafana
  #     - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
  #     - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
  #   networks:
  #     - monitoring
  #   restart: unless-stopped
  #   depends_on:
  #     - prometheus

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data:
  # alertmanager-data:
  # grafana-data: